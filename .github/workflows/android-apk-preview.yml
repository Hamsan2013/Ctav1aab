name: Build Preview APK (Custom Asset Engine)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate Required Assets
        run: |
          echo "📋 Checking for required assets..."
          
          # Dynamically search for any game HTML file in the root directory
          HTML_FILE=$(ls *.html 2>/dev/null | head -n 1)
          
          if [ -z "$HTML_FILE" ]; then
            echo "❌ ERROR: No game HTML file found in the root directory!"
            exit 1
          else
            echo "✅ Found HTML game file: $HTML_FILE"
          fi
          
          if [ ! -f "icon.png" ]; then
            echo "❌ ERROR: icon.png not found!"
            exit 1
          fi
          echo "✅ Assets validated"

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Android SDK Tools
        uses: android-actions/setup-android@v4

      - name: Create Web Distribution Structure
        run: |
          mkdir -p www
          
          # Automatically find your game file and copy it as index.html
          HTML_FILE=$(ls *.html | head -n 1)
          cp "$HTML_FILE" www/index.html
          echo "🌐 Packed $HTML_FILE into Capacitor web directory as index.html"
          
          cp icon.png www/icon.png

      - name: Initialize App Framework
        run: |
          npm install @capacitor/core @capacitor/cli --save
          npx cap init "CTA Cartoon Thief Auto" "com.addevelopers.cartoonthiefauto" --web-dir=www

      - name: Add Android Native Platform
        run: |
          npm install @capacitor/android --save
          npx cap add android

      - name: Sync Game HTML Assets
        run: |
          npx cap sync android

      - name: Force Custom Logo Integration
        run: |
          echo "🎨 Overwriting stock templates with custom logo graphic..."
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          for folder in mipmap-mdpi mipmap-hdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi; do
            DIR="android/app/src/main/res/$folder"
            mkdir -p "$DIR"
            cp icon.png "$DIR/ic_launcher.png"
            cp icon.png "$DIR/ic_launcher_round.png"
            cp icon.png "$DIR/ic_launcher_foreground.png"
          done

      - name: Fix Gradle Configuration (Flat Commands)
        run: |
          echo "🔧 Injecting dependency logic directly into build profile..."
          echo "configurations.all { resolutionStrategy { force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'; force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22' } }" >> android/app/build.gradle
          echo "android { aaptOptions { cruncherEnabled = false; useNewCruncher = false } }" >> android/app/build.gradle

      - name: Build Android Preview APK
        run: |
          cd android
          ./gradlew clean assembleRelease

      - name: Sign APK for Device Installation
        run: |
          echo "🔐 Generating debug key and signing APK..."
          # 1. Create a temporary debug keystore matrix on the fly
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          
          # 2. Locate apksigner utility from Android SDK Build Tools
          BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | tail -n 1)
          
          # 3. Digitally sign the unsigned package file
          $BUILD_TOOLS_DIR/apksigner sign --ks debug.keystore --ks-pass pass:android --key-pass pass:android --out android/app/build/outputs/apk/release/CartoonThiefAuto-Preview.apk android/app/build/outputs/apk/release/app-release-unsigned.apk
          echo "✅ APK successfully signed and prepared for deployment!"

      - name: Verify Signed APK Output
        run: |
          echo "📍 Verifying generated preview APK binary..."
          if [ -f "android/app/build/outputs/apk/release/CartoonThiefAuto-Preview.apk" ]; then
            echo "✅ Signed Installable APK Found!"
          else
            echo "❌ Critical Error: Signed target binary was not found."
            exit 1
          fi

      - name: Upload Signed Preview APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CartoonThiefAuto-Installable-APK
          path: android/app/build/outputs/apk/release/CartoonThiefAuto-Preview.apk
          retention-days: 14
